schemaVersion: "1"
kind: provider
id: s3
capability: storage
version: 0.1.0
name: S3
description: S3-compatible object storage (AWS, MinIO, R2).
status: experimental
selfHosted: true
managed: true
language: typescript
config:
  S3_ENDPOINT:
    type: string
    required: true
    description: The S3 endpoint URL.
  S3_ACCESS_KEY_ID:
    type: string
    required: true
    description: Access key ID.
  S3_SECRET_ACCESS_KEY:
    type: string
    required: true
    description: Secret access key.
    secret: true
  S3_REGION:
    type: string
    required: false
    description: Region name.
    default: us-east-1
