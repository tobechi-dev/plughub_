schemaVersion: "1"
kind: capability
id: email
version: 0.1.0
name: Email
description: Send transactional emails from your application.
status: experimental
contracts:
  - type: openapi
    path: ./openapi.yaml
  - type: asyncapi
    path: ./asyncapi.yaml
exports:
  - name: sendEmail
    description: Send a single transactional email.
    signature: "(input: SendEmailInput) => Promise<SendEmailResult>"
  - name: getEmailStatus
    description: Retrieve the current status of a sent email.
    signature: "(id: string) => Promise<EmailRecord>"
tags:
  - communication
  - transactional
